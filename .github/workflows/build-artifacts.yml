name: Build artifacts
on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      version: { type: string, required: true }
      channel: { type: string, required: true }
permissions: { contents: read }
jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: scriptc's runtime needs glibc >= 2.36 (pidfd_open) — 22.04 has 2.35
          - { target: linux-x64, os: ubuntu-24.04, flags: "" }
          - { target: linux-arm64, os: ubuntu-24.04-arm, flags: "" }
          # scriptc 0.1.7 ships no LLVM helper for macOS x64: use its C backend there
          - { target: darwin-x64, os: macos-15-intel, flags: "--backend c" }
          - { target: darwin-arm64, os: macos-14, flags: "" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm i -g scriptc@0.1.7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - run: ./build.sh
        env:
          AGENTGLASS_VERSION: ${{ inputs.version }}
          AGENTGLASS_CHANNEL: ${{ inputs.channel }}
          AGENTGLASS_COMMIT: ${{ inputs.ref }}
          SCRIPTC_FLAGS: ${{ matrix.flags }}
      - run: sh scripts/package.sh ${{ matrix.target }} "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with: { name: "agentglass-${{ matrix.target }}", path: "dist/agentglass-${{ matrix.target }}.tar.gz", retention-days: 7, if-no-files-found: error }
