name: Build artifacts
on:
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      version: { type: string, required: true }
      channel: { type: string, required: true }
permissions: { contents: read }
jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds in debian:12 so the binary needs only glibc 2.36 (scriptc's runtime calls pidfd_open,
          # new in 2.36; building on a newer glibc would also pull in e.g. fmod@GLIBC_2.38)
          - { target: linux-x64, os: ubuntu-24.04, container: "debian:12", flags: "" }
          - { target: linux-arm64, os: ubuntu-24.04-arm, container: "debian:12", flags: "" }
          # scriptc 0.1.7 ships no LLVM helper for macOS x64: use its C backend there
          - { target: darwin-x64, os: macos-15-intel, container: "", flags: "--backend c" }
          - { target: darwin-arm64, os: macos-14, container: "", flags: "" }
    steps:
      - if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq clang git curl xz-utils ca-certificates binutils openssl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}", fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm i -g scriptc@0.1.7
      - run: ./build.sh
        env:
          AGENTGLASS_VERSION: ${{ inputs.version }}
          AGENTGLASS_CHANNEL: ${{ inputs.channel }}
          AGENTGLASS_COMMIT: ${{ inputs.ref }}
          SCRIPTC_FLAGS: ${{ matrix.flags }}
      # built-in HTTPS for `agentglass receive` (otlp-hub 11.4): a second binary from the C backend, smoke-tested over TLS;
      # optional by design — a target where it fails ships without it and says so in the summary
      - id: tls
        continue-on-error: true
        run: sh scripts/build-tls.sh
      - if: always()
        shell: sh
        run: |
          if [ "${{ steps.tls.outcome }}" = success ]; then echo "${{ matrix.target }}: agentglass-receive-tls built (C backend) and smoke-tested" >> "$GITHUB_STEP_SUMMARY"
          else rm -f agentglass-receive-tls; echo "::warning::${{ matrix.target }} ships without agentglass-receive-tls (C-backend build or TLS smoke test failed)"; echo "${{ matrix.target }}: agentglass-receive-tls SKIPPED — see the tls step" >> "$GITHUB_STEP_SUMMARY"; fi
      - run: sh scripts/package.sh ${{ matrix.target }} "${{ inputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "agentglass-${{ matrix.target }}", path: "dist/agentglass-${{ matrix.target }}.tar.gz", retention-days: 7, if-no-files-found: error }
  # agentglass-web (local-web-api §11): one Linux host cross-compiles the four targets with Bun (x64 as baseline builds),
  # smoke-runs linux-x64 and packs agentglass-web-<target>.tar.gz; release.yml checksums and attests them with the rest
  web:
    name: build agentglass-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: sh scripts/build-web.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "agentglass-web", path: "dist/agentglass-web-*.tar.gz", retention-days: 7, if-no-files-found: error }
