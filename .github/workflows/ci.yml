name: CI
# one run per change: pushes to main, and pull requests (a branch push without a PR runs nothing; a PR push runs once)
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  diag:
    name: rev97 item6 macos diag
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: scriptc
        uses: ./.github/actions/scriptc
        with: { lane: "1of3" }
      - name: fixed build
        run: AGENTGLASS_OUT="$RUNNER_TEMP/ag" sh build.sh
      - name: wait + parity, fixed (twice)
        run: |
          for k in 1 2; do AGENTGLASS_BIN="$RUNNER_TEMP/ag" sh scripts/wait.test.sh; AGENTGLASS_BIN="$RUNNER_TEMP/ag" sh scripts/procs-parity.test.sh; done
          echo "TMPDIR=$TMPDIR"; d=$(mktemp -d); echo "mktemp: $d real: $(cd $d && pwd -P)"
      - name: unfixed build (procs.ts of the PR head)
        run: git show origin/perf/wait-followups:src/model/procs.ts > src/model/procs.ts && AGENTGLASS_OUT="$RUNNER_TEMP/ag0" sh build.sh
      - name: wait + parity, unfixed (expected to fail)
        continue-on-error: true
        run: AGENTGLASS_BIN="$RUNNER_TEMP/ag0" sh scripts/wait.test.sh || true
