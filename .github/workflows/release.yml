name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "tag whose release is still a draft (resume a failed run), e.g. v2026.9.1", required: true, type: string }
permissions: { contents: read }
concurrency: { group: "release-${{ github.event.inputs.tag || github.ref_name }}", cancel-in-progress: false }
jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs: { tag: "${{ steps.m.outputs.tag }}", version: "${{ steps.m.outputs.version }}", sha: "${{ steps.m.outputs.sha }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: m
        env: { TAG: "${{ github.event.inputs.tag || github.ref_name }}" }
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]*$' || { echo "::error::bad tag $TAG"; exit 1; }
          sha=$(git rev-list -n1 "$TAG")
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
  build:
    needs: meta
    uses: ./.github/workflows/build-artifacts.yml
    with: { ref: "${{ needs.meta.outputs.sha }}", version: "${{ needs.meta.outputs.version }}", channel: stable }
  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.meta.outputs.tag }}", VERSION: "${{ needs.meta.outputs.version }}", SHA: "${{ needs.meta.outputs.sha }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ needs.meta.outputs.sha }}", fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: "agentglass-*", path: out, merge-multiple: true }
      - name: checksums + metadata
        run: sh scripts/release-assets.sh out stable "$TAG" "$VERSION" "$SHA" && sh scripts/verify-release-assets.sh out
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: "out/agentglass-*.tar.gz" }
      - name: upload into the draft, publish when every asset is there (a published release is never touched)
        run: |
          . scripts/release-lib.sh; notes_for "$VERSION" > notes.md; [ -s notes.md ] || echo "Release $VERSION" > notes.md
          sh scripts/publish-release.sh "$TAG" out notes.md stable "agentglass $VERSION"
  # the formula is rendered here (scripts/formula.sh: agentglass plus agentglass-receive-tls where an archive ships it), proven
  # by a native brew install + test, then committed to the tap (its generic update-formula.yml only swaps versions and
  # checksums, so it could never add the second binary)
  tap:
    needs: [meta, publish]
    runs-on: ubuntu-24.04
    env: { TAG: "${{ needs.meta.outputs.tag }}", VERSION: "${{ needs.meta.outputs.version }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ needs.meta.outputs.sha }}", persist-credentials: false }
      - name: render the formula from the published assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p assets && gh release download "$TAG" -D assets && sh scripts/verify-release-assets.sh assets
          sh scripts/formula.sh assets "$VERSION" > agentglass.rb
      - name: brew audit, install, test
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          git config --global user.name "agentglass release"; git config --global user.email "agentglass-ci@example.invalid"
          brew tap-new agentglass-proof/tap
          brew trust agentglass-proof/tap   # current Homebrew refuses formulae from untrusted taps
          cp agentglass.rb "$(brew --repository agentglass-proof/tap)/Formula/agentglass.rb"
          brew audit --strict --formula agentglass-proof/tap/agentglass
          brew install --formula agentglass-proof/tap/agentglass
          brew test agentglass-proof/tap/agentglass
          if tar -tzf assets/agentglass-linux-x64.tar.gz | grep -qx agentglass-receive-tls; then "$(brew --prefix)/bin/agentglass-receive-tls" --version; fi
          brew uninstall --force agentglass && brew untap agentglass-proof/tap
      - name: commit it to the tap
        env: { GH_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}" }
        run: |
          p=repos/BjoernSchotte/homebrew-tap/contents/Formula/agentglass.rb
          if old=$(gh api "$p" -q .sha) && gh api -X PUT "$p" -f message="Update agentglass to $TAG" -f content="$(base64 -w0 agentglass.rb)" -f sha="$old" > /dev/null; then exit 0; fi
          # a token without contents access to the tap: its own update (versions and checksums; the install block stays as it was)
          echo "::warning::could not commit Formula/agentglass.rb to the tap (HOMEBREW_TAP_TOKEN needs contents: write there) — falling back to update-formula.yml"
          gh workflow run update-formula.yml -R BjoernSchotte/homebrew-tap -f formula=agentglass -f tag="$TAG" -f repository=BjoernSchotte/agentglass
