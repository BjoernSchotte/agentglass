version: 2
updates:
  # Every third-party action is pinned to a commit SHA; Dependabot bumps the SHA and its version comment.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
